# Render Blueprint — SkyEmpire 蓝天霸业（本分支专属）
#
# 注意：本分支（claude/airline-tycoon-dynamic-events-ps9if8）是 SkyEmpire 游戏的
# 主线。Matchday26 的蓝图在它自己的部署分支上，互不影响——从本分支创建 Blueprint
# 实例只会管理下面两个游戏服务。
#
# 老板操作（一次性）：Render Dashboard → New + → Blueprint → 选本仓库 →
# Branch 选本分支 → Apply。Render 会提示输入 ANTHROPIC_API_KEY（可留空，
# 留空则新闻管道停用、只用 57 条静态事件库，游戏照常可玩）。
# INGEST_TOKEN 由 Render 自动生成（之后在 skyempire-api 的 Environment 页可见，
# 配 GitHub Actions cron 时复制它）。

services:
  - type: web
    name: skyempire-api
    runtime: python
    plan: free
    rootDir: airline-game/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NEWS_PROVIDER
        value: gdelt
      # Claude 新闻结构化（console.anthropic.com 生成）。留空 = 仅静态事件库。
      - key: ANTHROPIC_API_KEY
        sync: false
      # 新闻注入端点令牌：Render 自动生成强随机值；配 cron 时从面板复制。
      - key: INGEST_TOKEN
        generateValue: true
      # 免费实例无持久盘：存档/事件池在重启时清零（升级 Starter+Disk 后把
      # GAMES_FILE/EVENTS_POOL_FILE 指到挂载路径即可持久化，见 airline-game/DEPLOY.md）。

  - type: web
    name: skyempire-web
    runtime: node
    plan: free
    rootDir: airline-game/web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 裸主机名（xxx.onrender.com），前端代码自动补 https://
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: skyempire-api
          property: host
