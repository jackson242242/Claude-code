# Render Blueprint — SkyEmpire 蓝天霸业（本分支专属）
#
# 注意：本分支（claude/airline-tycoon-dynamic-events-ps9if8）是 SkyEmpire 游戏的
# 主线。Matchday26 的蓝图在它自己的部署分支上，互不影响——从本分支创建 Blueprint
# 实例只会管理下面两个游戏服务。
#
# 老板操作（一次性）：Render Dashboard → New + → Blueprint → 选本仓库 →
# Branch 选本分支 → Apply。Render 会提示输入 ANTHROPIC_API_KEY（可留空，
# 留空则新闻管道停用、只用 57 条静态事件库，游戏照常可玩）。
# INGEST_TOKEN 由 Render 自动生成（之后在 skyempire-api 的 Environment 页可见，
# 配 GitHub Actions cron 时复制它）。

services:
  - type: web
    name: skyempire-api
    runtime: python
    plan: free
    rootDir: airline-game/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NEWS_PROVIDER
        value: gdelt
      # Claude 新闻结构化（console.anthropic.com 生成）。留空 = 仅静态事件库。
      - key: ANTHROPIC_API_KEY
        sync: false
      # 新闻注入端点令牌：Render 自动生成强随机值；配 cron 时从面板复制。
      - key: INGEST_TOKEN
        generateValue: true
      # 存档持久化（免费 Postgres）：DATABASE_URL 一旦设置即启用 PostgresStore，
      # 单人存档跨重启/休眠/重新部署保留——解决「Game not found」。表自动创建。
      - key: DATABASE_URL
        fromDatabase:
          name: skyempire-db
          property: connectionString
      # 注：多人对战房间仍在内存（match_store），重新部署会清空进行中的房间。

  - type: web
    name: skyempire-web
    runtime: node
    plan: free
    rootDir: airline-game/web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 公网地址写死（fromService 的 host 实测注入内部短名 "skyempire-api"，
      # 浏览器无法解析；2026-06-13 线上探针确认本地址 200）
      - key: NEXT_PUBLIC_API_URL
        value: https://skyempire-api.onrender.com

databases:
  # 免费 Postgres——存档持久化。Blueprint 同步时自动创建并把连接串注入
  # skyempire-api 的 DATABASE_URL；表由 PostgresStore 首次连接时自动建。
  - name: skyempire-db
    plan: free
