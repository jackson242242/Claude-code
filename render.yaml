# Render Blueprint — World Cup 2026 Tour Guide
#
# Stands up the full app on Render: a FastAPI backend (worldcup-api) and a
# Next.js frontend (worldcup-web). Two secrets (both `sync: false`, so Render
# prompts for them): DUFFEL_API_KEY powers live flights (Duffel Air) and
# LITEAPI_API_KEY powers live hotels (LiteAPI). Either can be omitted — on a
# missing key or any upstream error the API degrades gracefully to deterministic
# seed/mock data for that vertical, so the site always renders.
#
# The two cross-service URLs are wired automatically via `fromService` hosts;
# the app code tolerates a bare host (defaults to https). PostgreSQL is optional
# and omitted here — the API runs on in-process seed data + in-memory trips. See
# DEPLOY.md to add a managed database for persistence.

services:
  - type: web
    name: worldcup-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLIGHT_PROVIDER
        value: duffel
      # Hotels use LiteAPI (instant self-serve); Duffel Stays is sales-gated.
      - key: HOTEL_PROVIDER
        value: liteapi
      # Flights (Duffel Air) — works on a self-serve test token.
      - key: DUFFEL_API_KEY
        sync: false
      # Hotels (LiteAPI) — grab an instant sandbox key at liteapi.travel.
      - key: LITEAPI_API_KEY
        sync: false
      # Affiliate tracking ids (docs/affiliates.md). Optional — links work
      # without them, they just earn no commission. Not secrets, but set in
      # the dashboard once the programs approve the account (sync: false).
      - key: BOOKING_AID
        sync: false
      - key: KAYAK_AFFILIATE_ID
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: worldcup-web
          property: host

  - type: web
    name: worldcup-web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: worldcup-api
          property: host
      # AI concierge (Anthropic Messages API, streamed). Without it the chatbot
      # serves an honest degraded reply; set it and replies stream live. Grab a
      # key at console.anthropic.com. Render prompts for this (sync: false);
      # Render web services have open outbound, so no host allow-list is needed.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Pexels (api.pexels.com) — powers the cinematic hero video montage AND
      # the Fan Zone footage. Without it both honestly degrade to gradient
      # placeholders. Free instant key at pexels.com/api. Render prompts for
      # this (sync: false); web services have open outbound, no allow-list needed.
      - key: PEXELS_API_KEY
        sync: false
      # Affiliate ids for the frontend's offline-fallback links (mirror of the
      # API's BOOKING_AID / KAYAK_AFFILIATE_ID — see docs/affiliates.md).
      - key: NEXT_PUBLIC_BOOKING_AID
        sync: false
      - key: NEXT_PUBLIC_KAYAK_AFFILIATE_ID
        sync: false

  # Alexandra Huang art portfolio — plain static site, no build, no secrets.
  # Lives in alexandra-art/ (single index.html + works/ images). rootDir scopes
  # auto-deploys to changes inside that folder only.
  - type: web
    name: alexandra-art
    runtime: static
    rootDir: alexandra-art
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: .

  # VoiceMemoBot — standalone product (voice memo → AI remix → its own feed).
  # Serves the web prototype UI at "/" plus the JSON API. No secrets required:
  # without REPLICATE_API_TOKEN the offline DSP mock provider renders remixes.
  # RENDER_EXTERNAL_URL (set automatically by Render) is used for public file
  # URLs and post permalinks, so no manual URL wiring is needed.
  - type: web
    name: voicememobot-api
    runtime: python
    plan: free
    rootDir: voice-memo-watch/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Optional: enables real AI generation (melody-conditioned MusicGen).
      - key: REPLICATE_API_TOKEN
        sync: false

  # Stock Alternatives Tier List — a testable prototype with ZERO secrets.
  # stock-tiers-api serves the JSON API on deterministic seed data and a
  # deterministic mock tier engine; stock-tiers-web is the Expo app exported to
  # web (static SPA) pointed at the API via fromService host. Set ANTHROPIC_API_KEY
  # to light up the real Claude tier engine; set STOCK_PROVIDER=finnhub +
  # FINNHUB_API_KEY for live market data (free key OK). After enabling either,
  # confirm via GET /api/meta/providers and GET /api/meta/stock-probe. Under stock-tiers/.
  - type: web
    name: stock-tiers-api
    runtime: python
    plan: free
    rootDir: stock-tiers/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Deterministic seed market data — no key needed. Set to "finnhub" (and
      # supply FINNHUB_API_KEY below) for live prices.
      - key: STOCK_PROVIDER
        value: mock
      # Optional — light up the real Claude tier engine (TIER_PROVIDER=auto uses
      # it whenever this is set; otherwise the deterministic mock engine runs).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional — live market data; only used when STOCK_PROVIDER=finnhub.
      - key: FINNHUB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: stock-tiers-web
          property: host

  - type: web
    name: stock-tiers-web
    runtime: static
    rootDir: stock-tiers/app
    buildCommand: npm ci && npx expo export -p web
    staticPublishPath: dist
    # SPA: in-memory navigation, single served route — fall back to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Inlined into the web bundle at build time (bare host -> the client
      # normalizes to https). Render provides this during the build.
      - key: EXPO_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: stock-tiers-api
          property: host
