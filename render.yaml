# Render Blueprint — World Cup 2026 Tour Guide
#
# Stands up the full app on Render: a FastAPI backend (worldcup-api) and a
# Next.js frontend (worldcup-web). Two secrets (both `sync: false`, so Render
# prompts for them): DUFFEL_API_KEY powers live flights (Duffel Air) and
# LITEAPI_API_KEY powers live hotels (LiteAPI). Either can be omitted — on a
# missing key or any upstream error the API degrades gracefully to deterministic
# seed/mock data for that vertical, so the site always renders.
#
# The two cross-service URLs are wired automatically via `fromService` hosts;
# the app code tolerates a bare host (defaults to https). PostgreSQL is optional
# and omitted here — the API runs on in-process seed data + in-memory trips. See
# DEPLOY.md to add a managed database for persistence.

services:
  - type: web
    name: worldcup-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLIGHT_PROVIDER
        value: duffel
      # Hotels use LiteAPI (instant self-serve); Duffel Stays is sales-gated.
      - key: HOTEL_PROVIDER
        value: liteapi
      # Flights (Duffel Air) — works on a self-serve test token.
      - key: DUFFEL_API_KEY
        sync: false
      # Hotels (LiteAPI) — grab an instant sandbox key at liteapi.travel.
      - key: LITEAPI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: worldcup-web
          property: host

  - type: web
    name: worldcup-web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: worldcup-api
          property: host
      # AI concierge (Anthropic Messages API, streamed). Without it the chatbot
      # serves an honest degraded reply; set it and replies stream live. Grab a
      # key at console.anthropic.com. Render prompts for this (sync: false);
      # Render web services have open outbound, so no host allow-list is needed.
      - key: ANTHROPIC_API_KEY
        sync: false
