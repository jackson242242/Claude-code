<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexandra Huang — Art</title>
<meta name="description" content="Alexandra Huang — sketches, studies & visual notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f0;
    --ink: #2b2722;
    --muted: #8a8278;
    --accent: #c96f4a;
    --card: #fffdf9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ——— intro (no header, just a centered hello) ——— */
  .intro {
    min-height: 38vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4rem 1.5rem 2rem;
  }
  .intro h1 {
    font-family: 'Caveat', cursive;
    font-size: clamp(2.6rem, 7vw, 4.5rem);
    font-weight: 600;
    letter-spacing: 0.01em;
    transition: transform 0.4s ease;
  }
  .intro h1:hover { transform: rotate(-2deg) scale(1.03); }
  .intro p {
    margin-top: 0.6rem;
    color: var(--muted);
    font-size: 0.95rem;
    letter-spacing: 0.04em;
  }

  /* ——— category filter ——— */
  .filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.4rem;
    padding: 1.2rem 1rem 2.8rem;
  }
  .filters button {
    background: none;
    border: none;
    cursor: pointer;
    font: inherit;
    font-size: 0.92rem;
    color: var(--muted);
    padding: 0.2rem 0.1rem;
    position: relative;
    transition: color 0.25s ease;
  }
  .filters button:hover { color: var(--ink); }
  .filters button.active { color: var(--accent); }
  .filters button.active::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -4px;
    height: 3px;
    background: var(--accent);
    border-radius: 99px;
    transform: rotate(-1.2deg);
  }

  /* ——— work grid ——— */
  .grid {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 1.2rem 5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 2.2rem;
  }
  .work {
    background: var(--card);
    border-radius: 10px;
    padding: 0.8rem 0.8rem 1rem;
    box-shadow: 0 1px 3px rgba(43, 39, 34, 0.08);
    cursor: zoom-in;
    transition: transform 0.35s ease, box-shadow 0.35s ease, opacity 0.3s ease;
  }
  .work:nth-child(odd) { transform: rotate(-1deg); }
  .work:nth-child(even) { transform: rotate(1.1deg); }
  .work:hover {
    transform: rotate(0deg) translateY(-6px) scale(1.02);
    box-shadow: 0 14px 30px rgba(43, 39, 34, 0.16);
  }
  .work.hidden { display: none; }
  .work img {
    width: 100%;
    display: block;
    border-radius: 6px;
  }
  .work figcaption {
    padding-top: 0.7rem;
    font-size: 0.85rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.6rem;
  }
  .work figcaption .cat {
    color: var(--accent);
    font-family: 'Caveat', cursive;
    font-size: 1.05rem;
    white-space: nowrap;
  }

  .colophon {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    padding: 0 1rem 6rem;
  }

  /* ——— lightbox ——— */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(250, 247, 240, 0.96);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 2rem;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: min(92vw, 1000px);
    max-height: 80vh;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(43, 39, 34, 0.25);
  }
  .lightbox .lb-caption {
    margin-top: 1rem;
    font-size: 0.9rem;
    color: var(--ink);
  }
  .lightbox .lb-caption .cat { color: var(--accent); font-family: 'Caveat', cursive; font-size: 1.1rem; margin-left: 0.5rem; }

  /* ——— music toggle ——— */
  .music-btn {
    position: fixed;
    right: 1.4rem;
    bottom: 1.4rem;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: var(--ink);
    color: var(--bg);
    font-size: 1.25rem;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(43, 39, 34, 0.25);
    transition: transform 0.3s ease, background 0.3s ease;
    z-index: 30;
  }
  .music-btn:hover { transform: scale(1.1) rotate(-8deg); }
  .music-btn.playing {
    background: var(--accent);
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-5px) rotate(4deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .music-btn.playing { animation: none; }
    .work, .intro h1, .music-btn { transition: none; }
  }
</style>
</head>
<body>

<section class="intro">
  <h1>Alexandra Huang</h1>
  <p>sketches · studies · visual notes</p>
</section>

<nav class="filters" aria-label="Categories"></nav>

<main class="grid" id="grid"></main>

<p class="colophon">© 2026 Alexandra Huang · drawn in pencil, mostly</p>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <img id="lb-img" src="" alt="">
  <p class="lb-caption"><span id="lb-title"></span><span class="cat" id="lb-cat"></span></p>
</div>

<button class="music-btn" id="musicBtn" aria-label="Play music" aria-pressed="false">♪</button>

<script>
// ——— works: add a new piece = drop the image in works/ and add a line here ———
const CATEGORIES = ['All', 'Sketchbook', 'Studies', 'Visual Notes'];
const WORKS = [
  { src: 'works/art-do-now.jpg',      title: 'Art Do Now — daily sketch prompts', cat: 'Sketchbook' },
  { src: 'works/value-scales.jpg',    title: 'Value scales & form shading',       cat: 'Studies' },
  { src: 'works/texture-studies.jpg', title: 'Texture studies in pencil',         cat: 'Studies' },
  { src: 'works/elements-of-art.jpg', title: 'The elements of art',               cat: 'Visual Notes' },
  { src: 'works/color-theory.jpg',    title: 'Color theory',                      cat: 'Visual Notes' },
];
// set to a file like 'music.mp3' to play a real track instead of the music box
const MUSIC_SRC = null;

// ——— grid + filters ———
const grid = document.getElementById('grid');
WORKS.forEach((w, i) => {
  const fig = document.createElement('figure');
  fig.className = 'work';
  fig.dataset.cat = w.cat;
  fig.innerHTML = `<img src="${w.src}" alt="${w.title}" loading="lazy">
    <figcaption><span>${w.title}</span><span class="cat">${w.cat}</span></figcaption>`;
  fig.addEventListener('click', () => openLightbox(i));
  grid.appendChild(fig);
});

const filters = document.querySelector('.filters');
CATEGORIES.forEach(cat => {
  const btn = document.createElement('button');
  btn.textContent = cat;
  if (cat === 'All') btn.classList.add('active');
  btn.addEventListener('click', () => {
    filters.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.work').forEach(el => {
      el.classList.toggle('hidden', cat !== 'All' && el.dataset.cat !== cat);
    });
  });
  filters.appendChild(btn);
});

// ——— lightbox ———
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbTitle = document.getElementById('lb-title');
const lbCat = document.getElementById('lb-cat');
const openLightbox = (i) => {
  const w = WORKS[i];
  lbImg.src = w.src;
  lbImg.alt = w.title;
  lbTitle.textContent = w.title;
  lbCat.textContent = w.cat;
  lightbox.classList.add('open');
};
lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') lightbox.classList.remove('open');
});

// ——— music: a tiny generative music box (no audio file needed) ———
const musicBtn = document.getElementById('musicBtn');
let playing = false;
let ctx = null, master = null, timer = null, audioEl = null;

const SCALE = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5]; // C major pentatonic
const startMusicBox = () => {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  if (!master) {
    master = ctx.createGain();
    master.gain.value = 0.14;
    const delay = ctx.createDelay();
    delay.delayTime.value = 0.38;
    const feedback = ctx.createGain();
    feedback.gain.value = 0.3;
    master.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    master.connect(ctx.destination);
    delay.connect(ctx.destination);
  }
  let step = 0;
  const tick = () => {
    if (Math.random() > 0.22) { // occasional rests keep it gentle
      const note = SCALE[(step + Math.floor(Math.random() * 3)) % SCALE.length];
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = note * (Math.random() < 0.12 ? 0.5 : 1);
      env.gain.setValueAtTime(0.0001, ctx.currentTime);
      env.gain.exponentialRampToValueAtTime(1, ctx.currentTime + 0.015);
      env.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.6);
      osc.connect(env);
      env.connect(master);
      osc.start();
      osc.stop(ctx.currentTime + 1.7);
    }
    step += Math.random() < 0.7 ? 1 : 2;
    timer = setTimeout(tick, 420 + Math.random() * 160);
  };
  tick();
};
const stopMusicBox = () => {
  clearTimeout(timer);
  if (ctx) ctx.suspend();
};

musicBtn.addEventListener('click', () => {
  playing = !playing;
  if (MUSIC_SRC) {
    audioEl = audioEl || Object.assign(new Audio(MUSIC_SRC), { loop: true, volume: 0.5 });
    playing ? audioEl.play() : audioEl.pause();
  } else {
    playing ? startMusicBox() : stopMusicBox();
  }
  musicBtn.classList.toggle('playing', playing);
  musicBtn.textContent = playing ? '♫' : '♪';
  musicBtn.setAttribute('aria-pressed', String(playing));
  musicBtn.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
});
</script>
</body>
</html>
