<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexandra Huang — Art</title>
<meta name="description" content="Alexandra Huang — sketches, studies & visual notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f0;
    --ink: #2b2722;
    --muted: #8a8278;
    --accent: #c96f4a;
    --card: #fffdf9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ——— character dock (the only chrome on the page) ——— */
  .dock {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
    gap: clamp(0.7rem, 4vw, 2rem);
    padding: 2.4rem 1rem 2.6rem;
  }
  .chibi {
    background: none;
    border: none;
    cursor: pointer;
    font: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    color: var(--muted);
    position: relative;
  }
  .chibi svg {
    width: clamp(48px, 9vw, 64px);
    height: clamp(48px, 9vw, 64px);
    filter: grayscale(0.5) opacity(0.7);
    transition: filter 0.3s ease, transform 0.3s ease;
    animation: idle 3.4s ease-in-out infinite;
  }
  .chibi:nth-child(1) svg { animation-delay: 0s; }
  .chibi:nth-child(2) svg { animation-delay: 0.4s; }
  .chibi:nth-child(3) svg { animation-delay: 0.8s; }
  .chibi:nth-child(4) svg { animation-delay: 1.2s; }
  .chibi:nth-child(5) svg { animation-delay: 1.6s; }
  @keyframes idle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .chibi:hover svg {
    filter: grayscale(0) opacity(1);
    animation: hop 0.5s ease;
  }
  @keyframes hop {
    0% { transform: translateY(0); }
    40% { transform: translateY(-12px) rotate(-6deg); }
    70% { transform: translateY(0) rotate(3deg); }
    100% { transform: translateY(0) rotate(0); }
  }
  .chibi .lbl { font-size: 0.78rem; letter-spacing: 0.03em; transition: color 0.25s ease; }
  .chibi.active svg, .chibi.playing svg {
    filter: grayscale(0) opacity(1);
    transform: scale(1.12);
  }
  .chibi.active .lbl, .chibi.playing .lbl { color: var(--accent); font-weight: 500; }
  .chibi.active::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    width: 26px;
    height: 3px;
    margin-left: -13px;
    background: var(--accent);
    border-radius: 99px;
    transform: rotate(-1.5deg);
  }
  .chibi.playing svg { animation: dance 0.9s ease-in-out infinite; }
  @keyframes dance {
    0%, 100% { transform: scale(1.12) rotate(-7deg); }
    50% { transform: scale(1.12) rotate(7deg) translateY(-4px); }
  }
  .chibi .notes {
    position: absolute;
    top: -6px;
    right: -10px;
    font-size: 1rem;
    color: var(--accent);
    opacity: 0;
    pointer-events: none;
  }
  .chibi.playing .notes { animation: floatnotes 1.8s ease-out infinite; }
  @keyframes floatnotes {
    0% { opacity: 0; transform: translateY(4px) rotate(0); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-18px) rotate(14deg); }
  }

  /* ——— work grid ——— */
  .grid {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 1.2rem 5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 2.2rem;
  }
  .work {
    background: var(--card);
    border-radius: 10px;
    padding: 0.8rem 0.8rem 1rem;
    box-shadow: 0 1px 3px rgba(43, 39, 34, 0.08);
    cursor: zoom-in;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }
  .work:nth-child(odd) { transform: rotate(-1deg); }
  .work:nth-child(even) { transform: rotate(1.1deg); }
  .work:hover {
    transform: rotate(0deg) translateY(-6px) scale(1.02);
    box-shadow: 0 14px 30px rgba(43, 39, 34, 0.16);
  }
  .work.hidden { display: none; }
  .work img { width: 100%; display: block; border-radius: 6px; }
  .work figcaption {
    padding-top: 0.7rem;
    font-size: 0.85rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.6rem;
  }
  .work figcaption .cat {
    color: var(--accent);
    font-family: 'Caveat', cursive;
    font-size: 1.05rem;
    white-space: nowrap;
  }

  .colophon {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    padding: 0 1rem 3rem;
  }
  .colophon .name { font-family: 'Caveat', cursive; font-size: 1.15rem; color: var(--ink); }

  /* ——— lightbox ——— */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(250, 247, 240, 0.96);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 2rem;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: min(92vw, 1000px);
    max-height: 80vh;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(43, 39, 34, 0.25);
  }
  .lightbox .lb-caption { margin-top: 1rem; font-size: 0.9rem; }
  .lightbox .lb-caption .cat { color: var(--accent); font-family: 'Caveat', cursive; font-size: 1.1rem; margin-left: 0.5rem; }

  @media (prefers-reduced-motion: reduce) {
    .chibi svg, .chibi.playing svg, .chibi.playing .notes { animation: none; }
    .work, .chibi svg { transition: none; }
  }
</style>
</head>
<body>

<main class="grid" id="grid"></main>

<p class="colophon"><span class="name">Alexandra Huang</span><br>sketches · studies · visual notes — drawn in pencil, mostly · © 2026</p>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <img id="lb-img" src="" alt="">
  <p class="lb-caption"><span id="lb-title"></span><span class="cat" id="lb-cat"></span></p>
</div>

<script>
// ——— works: add a new piece = drop the image in works/ and add a line here ———
const WORKS = [
  { src: 'works/art-do-now.jpg',      title: 'Art Do Now — daily sketch prompts', cat: 'Sketchbook' },
  { src: 'works/value-scales.jpg',    title: 'Value scales & form shading',       cat: 'Studies' },
  { src: 'works/texture-studies.jpg', title: 'Texture studies in pencil',         cat: 'Studies' },
  { src: 'works/elements-of-art.jpg', title: 'The elements of art',               cat: 'Visual Notes' },
  { src: 'works/color-theory.jpg',    title: 'Color theory',                      cat: 'Visual Notes' },
];
// set to a file like 'music.mp3' to play a real track instead of the music box
const MUSIC_SRC = null;

// ——— grid ———
const grid = document.getElementById('grid');
WORKS.forEach((w, i) => {
  const fig = document.createElement('figure');
  fig.className = 'work';
  fig.dataset.cat = w.cat;
  fig.innerHTML = `<img src="${w.src}" alt="${w.title}" loading="lazy">
    <figcaption><span>${w.title}</span><span class="cat">${w.cat}</span></figcaption>`;
  fig.addEventListener('click', () => openLightbox(i));
  grid.appendChild(fig);
});

// ——— character filters ———
document.querySelectorAll('.dock [data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.dock [data-cat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cat = btn.dataset.cat;
    document.querySelectorAll('.work').forEach(el => {
      el.classList.toggle('hidden', cat !== 'All' && el.dataset.cat !== cat);
    });
  });
});

// ——— lightbox ———
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbTitle = document.getElementById('lb-title');
const lbCat = document.getElementById('lb-cat');
const openLightbox = (i) => {
  const w = WORKS[i];
  lbImg.src = w.src;
  lbImg.alt = w.title;
  lbTitle.textContent = w.title;
  lbCat.textContent = w.cat;
  lightbox.classList.add('open');
};
lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') lightbox.classList.remove('open');
});

// ——— music: a tiny generative music box (no audio file needed) ———
const musicBtn = document.getElementById('musicBtn');
let playing = false;
let ctx = null, master = null, timer = null, audioEl = null;

const SCALE = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5]; // C major pentatonic
const startMusicBox = () => {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  if (!master) {
    master = ctx.createGain();
    master.gain.value = 0.14;
    const delay = ctx.createDelay();
    delay.delayTime.value = 0.38;
    const feedback = ctx.createGain();
    feedback.gain.value = 0.3;
    master.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    master.connect(ctx.destination);
    delay.connect(ctx.destination);
  }
  let step = 0;
  const tick = () => {
    if (Math.random() > 0.22) { // occasional rests keep it gentle
      const note = SCALE[(step + Math.floor(Math.random() * 3)) % SCALE.length];
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = note * (Math.random() < 0.12 ? 0.5 : 1);
      env.gain.setValueAtTime(0.0001, ctx.currentTime);
      env.gain.exponentialRampToValueAtTime(1, ctx.currentTime + 0.015);
      env.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.6);
      osc.connect(env);
      env.connect(master);
      osc.start();
      osc.stop(ctx.currentTime + 1.7);
    }
    step += Math.random() < 0.7 ? 1 : 2;
    timer = setTimeout(tick, 420 + Math.random() * 160);
  };
  tick();
};
const stopMusicBox = () => {
  clearTimeout(timer);
  if (ctx) ctx.suspend();
};

musicBtn.addEventListener('click', () => {
  playing = !playing;
  if (MUSIC_SRC) {
    audioEl = audioEl || Object.assign(new Audio(MUSIC_SRC), { loop: true, volume: 0.5 });
    playing ? audioEl.play() : audioEl.pause();
  } else {
    playing ? startMusicBox() : stopMusicBox();
  }
  musicBtn.classList.toggle('playing', playing);
  musicBtn.setAttribute('aria-pressed', String(playing));
  musicBtn.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
});
</script>
</body>
