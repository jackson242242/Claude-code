<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Thomas 学习中心</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #4f46e5;
    --blue-light: #818cf8;
    --gold: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --purple: #8b5cf6;
    --bg: #f8faff;
    --card: #ffffff;
    --text: #1e1b4b;
    --text-2: #6b7280;
    --shadow: 0 2px 20px rgba(0,0,0,0.08);
    --radius: 20px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* ── TABS ── */
  #main-content {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 90px;
    scroll-behavior: smooth;
  }

  .tab-pane { display: none; padding: 16px; }
  .tab-pane.active { display: block; }

  /* ── BOTTOM TAB BAR ── */
  #tab-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-top: 1px solid #e5e7eb;
    display: flex;
    padding-bottom: env(safe-area-inset-bottom, 10px);
    z-index: 100;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
  }

  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 4px 6px;
    border: none;
    background: transparent;
    cursor: pointer;
    gap: 3px;
    transition: all 0.2s;
  }

  .tab-btn .tab-icon { font-size: 22px; line-height: 1; }
  .tab-btn .tab-label {
    font-size: 10px;
    font-weight: 600;
    color: #9ca3af;
    letter-spacing: 0.3px;
    transition: color 0.2s;
  }

  .tab-btn.active .tab-label { color: var(--blue); }
  .tab-btn.active .tab-icon { filter: drop-shadow(0 0 4px rgba(79,70,229,0.4)); }

  /* ── HEADER ── */
  .page-header {
    background: linear-gradient(135deg, var(--blue) 0%, #7c3aed 100%);
    border-radius: 0 0 28px 28px;
    padding: 20px 20px 24px;
    color: white;
    margin-bottom: 16px;
  }

  .page-header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .page-header .subtitle { font-size: 13px; opacity: 0.85; }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 14px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-2);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── DATE + STREAK ── */
  .date-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .date-text { font-size: 15px; font-weight: 700; color: var(--text); }
  .date-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }

  .streak-badge {
    background: linear-gradient(135deg, var(--gold), #fbbf24);
    color: white;
    border-radius: 50px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(245,158,11,0.35);
  }

  /* ── MEAL LOG ── */
  #meal-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--green), #059669);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
    box-shadow: 0 4px 12px rgba(16,185,129,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  #meal-btn:active { transform: scale(0.97); }

  .meal-deadline {
    text-align: center;
    font-size: 12px;
    color: var(--text-2);
    margin-top: 8px;
  }

  .meal-deadline strong { color: var(--blue); }

  /* ── LESSON TYPE BADGE ── */
  .lesson-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 12px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .badge-invest { background: rgba(245,158,11,0.15); color: #b45309; }
  .badge-ai { background: rgba(79,70,229,0.12); color: #4338ca; }

  /* ── BIG QUESTION ── */
  .big-question {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 14px;
  }

  /* ── CONTENT SECTIONS ── */
  .content-section {
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    font-size: 14px;
    line-height: 1.65;
  }

  .section-answer {
    background: linear-gradient(135deg, rgba(79,70,229,0.07), rgba(79,70,229,0.03));
    border-left: 3px solid var(--blue);
  }

  .section-analogy {
    background: rgba(245,158,11,0.08);
    border-left: 3px solid var(--gold);
  }

  .section-deepthink {
    background: linear-gradient(135deg, rgba(139,92,246,0.08), rgba(139,92,246,0.03));
    border-left: 3px solid var(--purple);
  }

  .section-challenge {
    background: linear-gradient(135deg, rgba(16,185,129,0.08), rgba(16,185,129,0.03));
    border-left: 3px solid var(--green);
  }

  .section-funfact {
    background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(245,158,11,0.05));
    border: 1px solid rgba(245,158,11,0.25);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    font-size: 13px;
    line-height: 1.6;
    color: #92400e;
  }

  .section-label {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .section-answer .section-label { color: var(--blue); }
  .section-analogy .section-label { color: #b45309; }
  .section-deepthink .section-label { color: var(--purple); }
  .section-challenge .section-label { color: #065f46; }

  /* ── CHECKBOXES ── */
  .check-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: white;
    border-radius: 14px;
    border: 2px solid #e5e7eb;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 10px;
    -webkit-tap-highlight-color: transparent;
  }

  .check-row:active { transform: scale(0.98); }
  .check-row.checked { border-color: var(--green); background: rgba(16,185,129,0.05); }

  .check-box {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    border: 2.5px solid #d1d5db;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    font-size: 14px;
  }

  .check-row.checked .check-box {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }

  .check-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
  }

  .check-xp {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-2);
    background: #f3f4f6;
    padding: 3px 8px;
    border-radius: 50px;
  }

  .check-row.checked .check-xp {
    background: rgba(16,185,129,0.15);
    color: #065f46;
  }

  /* ── SKILLS TAB ── */
  .level-card {
    background: linear-gradient(135deg, var(--blue), #7c3aed);
    border-radius: var(--radius);
    padding: 20px;
    color: white;
    margin-bottom: 14px;
    box-shadow: 0 4px 20px rgba(79,70,229,0.3);
  }

  .level-name {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }

  .level-sub { font-size: 13px; opacity: 0.8; margin-top: 2px; margin-bottom: 14px; }

  .xp-bar-bg {
    background: rgba(255,255,255,0.2);
    border-radius: 50px;
    height: 10px;
    overflow: hidden;
  }

  .xp-bar-fill {
    background: white;
    height: 100%;
    border-radius: 50px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .xp-label {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 6px;
    display: flex;
    justify-content: space-between;
  }

  .total-xp-badge {
    background: rgba(255,255,255,0.2);
    border-radius: 50px;
    padding: 4px 12px;
    font-size: 13px;
    font-weight: 700;
    display: inline-block;
    margin-bottom: 8px;
  }

  .skill-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 14px 0;
    border-bottom: 1px solid #f3f4f6;
  }

  .skill-item:last-child { border-bottom: none; }

  .skill-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .skill-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .skill-xp {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
  }

  .skill-bar-bg {
    height: 8px;
    background: #f3f4f6;
    border-radius: 50px;
    overflow: hidden;
  }

  .skill-bar-fill {
    height: 100%;
    border-radius: 50px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .skill-level-dot {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-2);
  }

  /* ── TOOLBOX ── */
  .template-item {
    background: white;
    border: 1.5px solid #e5e7eb;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .template-text {
    flex: 1;
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
  }

  .copy-btn {
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .copy-btn:active { transform: scale(0.95); }
  .copy-btn.copied { background: var(--green); }

  /* ── CALCULATOR ── */
  .calc-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }

  .calc-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .calc-field label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .calc-field input {
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    background: white;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .calc-field input:focus { border-color: var(--blue); }

  .calc-btn {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, var(--blue), #7c3aed);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s;
    box-shadow: 0 4px 12px rgba(79,70,229,0.3);
  }

  .calc-btn:active { transform: scale(0.98); }

  .calc-result {
    display: none;
    margin-top: 4px;
  }

  .calc-result.show { display: block; }

  .calc-numbers {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 12px;
    gap: 12px;
  }

  .calc-num-block { flex: 1; text-align: center; }
  .calc-num-label { font-size: 11px; color: var(--text-2); font-weight: 600; margin-bottom: 4px; }
  .calc-num-value { font-size: 18px; font-weight: 800; color: var(--text); }
  .calc-num-value.big { font-size: 22px; color: var(--green); }

  .calc-arrow { font-size: 22px; color: var(--text-2); padding-bottom: 4px; }

  .calc-bar-container { margin-top: 8px; }
  .calc-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .calc-bar-label { font-size: 11px; color: var(--text-2); width: 40px; text-align: right; font-weight: 600; }
  .calc-bar-track { flex: 1; background: #f3f4f6; border-radius: 50px; height: 14px; overflow: hidden; }
  .calc-bar-inner { height: 100%; border-radius: 50px; transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .bar-initial { background: linear-gradient(90deg, #94a3b8, #64748b); }
  .bar-final { background: linear-gradient(90deg, var(--green), #059669); }
  .calc-multiplier {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-2);
    margin-top: 10px;
  }
  .calc-multiplier strong { color: var(--green); font-size: 16px; }

  /* ── SECTION HEADING ── */
  .section-heading {
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  /* ── ANIMATION ── */
  @keyframes popIn {
    0% { transform: scale(0.95); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .card { animation: popIn 0.25s ease; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: white;
    border-radius: 50px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 200;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── MISC ── */
  .divider { height: 1px; background: #f3f4f6; margin: 6px 0 12px; }
  strong { font-weight: 800; }
</style>
</head>
<body>

<div id="main-content">

  <!-- TAB 1: 今日任务 -->
  <div id="tab-mission" class="tab-pane active">

    <!-- Header -->
    <div class="page-header">
      <h1>👋 你好，Thomas！</h1>
      <div class="subtitle" id="header-date">今天是学习日</div>
    </div>

    <!-- Date + Streak Card -->
    <div class="card">
      <div class="date-row">
        <div>
          <div class="date-text" id="today-date"></div>
          <div class="date-sub">坚持学习，每天进步一点点</div>
        </div>
        <div class="streak-badge">
          🔥 <span id="streak-count">0</span> 天连续
        </div>
      </div>

      <button id="meal-btn" onclick="logMeal()">
        🍱 Log Meal — Add 1 Day
      </button>
      <div class="meal-deadline" id="meal-deadline-text">还未记录用餐</div>
    </div>

    <!-- Today's Lesson Card -->
    <div class="card" id="lesson-card">
      <div class="card-title">📚 今天的大问题</div>

      <span class="lesson-type-badge" id="lesson-badge"></span>

      <div class="big-question" id="lesson-question"></div>

      <div class="content-section section-answer">
        <div class="section-label">💡 答案揭晓</div>
        <div id="lesson-answer"></div>
      </div>

      <div class="content-section section-analogy">
        <div class="section-label">🎯 生活比喻</div>
        <div id="lesson-analogy"></div>
      </div>

      <div class="section-funfact" id="lesson-funfact-block">
        <div class="section-label" style="color:#92400e;">⚡ 震惊事实</div>
        <div id="lesson-funfact"></div>
      </div>

      <div class="content-section section-deepthink">
        <div class="section-label">🧠 深度思考</div>
        <div id="lesson-deepthink"></div>
      </div>

      <div class="content-section section-challenge">
        <div class="section-label">🚀 今日挑战</div>
        <div id="lesson-challenge"></div>
      </div>
    </div>

    <!-- Completion Checkboxes -->
    <div class="card">
      <div class="card-title">✅ 今日完成</div>

      <div class="check-row" id="check-lesson" onclick="toggleCheck('lesson')">
        <div class="check-box" id="check-lesson-box"></div>
        <span class="check-text">完成课程 + 深度思考</span>
        <span class="check-xp" id="xp-lesson">+30 XP</span>
      </div>

      <div class="check-row" id="check-challenge" onclick="toggleCheck('challenge')">
        <div class="check-box" id="check-challenge-box"></div>
        <span class="check-text">完成今日挑战</span>
        <span class="check-xp" id="xp-challenge">+15 XP</span>
      </div>
    </div>

  </div><!-- /tab-mission -->


  <!-- TAB 2: 我的能力 -->
  <div id="tab-skills" class="tab-pane">

    <div class="page-header">
      <h1>我的能力</h1>
      <div class="subtitle">每次完成任务都在变强</div>
    </div>

    <!-- Level Card -->
    <div class="level-card">
      <div class="total-xp-badge" id="total-xp-badge">总 XP: 0</div>
      <div class="level-name" id="level-name">好奇探索者</div>
      <div class="level-sub" id="level-sub">继续学习，解锁下一个称号！</div>
      <div class="xp-bar-bg">
        <div class="xp-bar-fill" id="level-bar" style="width:0%"></div>
      </div>
      <div class="xp-label">
        <span id="level-xp-current">0 XP</span>
        <span id="level-xp-next">下一级: 100 XP</span>
      </div>
    </div>

    <!-- Skills -->
    <div class="card">
      <div class="card-title">🌟 技能成长</div>
      <div id="skills-list"></div>
    </div>

  </div><!-- /tab-skills -->


  <!-- TAB 3: 工具箱 -->
  <div id="tab-tools" class="tab-pane">

    <div class="page-header">
      <h1>🛠️ 工具箱</h1>
      <div class="subtitle">让 AI 成为你最强的工具</div>
    </div>

    <!-- Prompt Templates -->
    <div class="card">
      <div class="section-heading">❓ AI 提问模板</div>
      <div id="templates-list"></div>
    </div>

    <!-- Compound Interest Calculator -->
    <div class="card">
      <div class="section-heading">💰 复利计算器</div>

      <div class="calc-form">
        <div class="calc-field">
          <label>初始金额 ($)</label>
          <input type="number" id="calc-pv" value="1000" min="0" inputmode="decimal">
        </div>
        <div class="calc-field">
          <label>每月追加 ($)</label>
          <input type="number" id="calc-pmt" value="100" min="0" inputmode="decimal">
        </div>
        <div class="calc-field">
          <label>年化利率 (%)</label>
          <input type="number" id="calc-rate" value="10" min="0" max="100" step="0.1" inputmode="decimal">
        </div>
        <div class="calc-field">
          <label>年数</label>
          <input type="number" id="calc-years" value="30" min="1" max="100" inputmode="numeric">
        </div>
        <button class="calc-btn" onclick="calculate()">📈 计算！</button>
      </div>

      <div class="calc-result" id="calc-result">
        <div class="calc-numbers">
          <div class="calc-num-block">
            <div class="calc-num-label">初始投入</div>
            <div class="calc-num-value" id="result-initial">—</div>
          </div>
          <div class="calc-arrow">→</div>
          <div class="calc-num-block">
            <div class="calc-num-label">最终金额</div>
            <div class="calc-num-value big" id="result-final">—</div>
          </div>
        </div>

        <div class="calc-bar-container">
          <div class="calc-bar-row">
            <span class="calc-bar-label">初始</span>
            <div class="calc-bar-track">
              <div class="calc-bar-inner bar-initial" id="bar-initial" style="width:100%"></div>
            </div>
          </div>
          <div class="calc-bar-row">
            <span class="calc-bar-label">最终</span>
            <div class="calc-bar-track">
              <div class="calc-bar-inner bar-final" id="bar-final" style="width:0%"></div>
            </div>
          </div>
        </div>

        <div class="calc-multiplier" id="calc-multiplier"></div>
      </div>
    </div>

  </div><!-- /tab-tools -->

</div><!-- /main-content -->

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getDayIndex() {
  const d = new Date();
  // Days since a fixed epoch
  const epoch = new Date('2024-01-01');
  const days = Math.floor((d - epoch) / 86400000);
  return days;
}

function getTodayLesson() {
  // 家长指定的主题优先
  const key = new Date().toISOString().slice(0, 10);
  if (FOCUS_OVERRIDE[key]) return FOCUS_OVERRIDE[key];

  const idx = getDayIndex();
  // Even days = invest, odd = ai
  if (idx % 2 === 0) {
    return { lesson: INVEST[idx % 7], source: 'invest' };
  } else {
    return { lesson: AI_LESSONS[idx % 7], source: 'ai' };
  }
}

function formatDate(d) {
  const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  return `${d.getFullYear()}年 ${months[d.getMonth()]}${d.getDate()}日 ${days[d.getDay()]}`;
}

function formatMoney(n) {
  if (n >= 1000000) return '$' + (n/1000000).toFixed(2) + 'M';
  if (n >= 1000) return '$' + n.toLocaleString('en-US', {maximumFractionDigits: 0});
  return '$' + n.toFixed(2);
}

function showToast(msg, emoji = '✅') {
  const t = document.getElementById('toast');
  t.textContent = emoji + ' ' + msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function switchTab(tab) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('tbtn-' + tab).classList.add('active');
  if (tab === 'skills') renderSkills();
}

// ─── STREAK ───────────────────────────────────────────────────────────────────

function updateStreak() {
  const today = todayKey();
  if (STATE.lastStreakDate === today) return;
  const yesterday = (() => {
    const d = new Date(); d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  })();
  if (STATE.lastStreakDate === yesterday) {
    STATE.streak = (STATE.streak || 0) + 1;
  } else if (STATE.lastStreakDate !== today) {
    STATE.streak = 1;
  }
  STATE.lastStreakDate = today;
  saveState(STATE);
}

// ─── MEAL LOG ─────────────────────────────────────────────────────────────────

function logMeal() {
  if (!STATE.mealDeadline) {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    STATE.mealDeadline = d.toISOString().split('T')[0];
  } else {
    const d = new Date(STATE.mealDeadline + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    STATE.mealDeadline = d.toISOString().split('T')[0];
  }
  STATE.mealCount = (STATE.mealCount || 0) + 1;
  saveState(STATE);
  renderMeal();
  showToast('餐食已记录！又多了一天！', '🍱');
}

function renderMeal() {
  const el = document.getElementById('meal-deadline-text');
  if (!STATE.mealDeadline) {
    el.innerHTML = '还未记录用餐';
  } else {
    const d = new Date(STATE.mealDeadline + 'T00:00:00');
    const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    el.innerHTML = `截止日期延到：<strong>${d.getFullYear()}年${months[d.getMonth()]}${d.getDate()}日</strong>（共记录 ${STATE.mealCount} 次）`;
  }
}

// ─── LESSON RENDER ────────────────────────────────────────────────────────────

function renderLesson() {
  const { lesson, source } = getTodayLesson();
  const today = todayKey();
  const completed = STATE.completedDays[today] || {};

  // Badge
  const badge = document.getElementById('lesson-badge');
  if (source === 'invest') {
    badge.className = 'lesson-type-badge badge-invest';
    badge.textContent = '💰 投资思维';
  } else {
    badge.className = 'lesson-type-badge badge-ai';
    badge.textContent = '🤖 AI 探索';
  }

  document.getElementById('lesson-question').textContent = lesson.question;
  document.getElementById('lesson-answer').innerHTML = lesson.answer;
  document.getElementById('lesson-analogy').textContent = lesson.analogy;
  document.getElementById('lesson-deepthink').textContent = lesson.deepThink;
  document.getElementById('lesson-challenge').textContent = lesson.challenge;
  document.getElementById('lesson-funfact').textContent = lesson.funFact;

  // Checkboxes
  setCheckState('lesson', !!completed.lesson);
  setCheckState('challenge', !!completed.challenge);
}

function setCheckState(key, checked) {
  const row = document.getElementById('check-' + key);
  const box = document.getElementById('check-' + key + '-box');
  if (checked) {
    row.classList.add('checked');
    box.textContent = '✓';
  } else {
    row.classList.remove('checked');
    box.textContent = '';
  }
}

function toggleCheck(key) {
  const today = todayKey();
  if (!STATE.completedDays[today]) STATE.completedDays[today] = {};
  const already = !!STATE.completedDays[today][key];

  if (already) {
    // Uncheck — subtract XP
    STATE.completedDays[today][key] = false;
    applyXP(key, -1);
    showToast('已取消', '↩️');
  } else {
    STATE.completedDays[today][key] = true;
    applyXP(key, +1);
    if (key === 'lesson') showToast('课程完成！+30 XP', '🧠');
    else showToast('挑战完成！+15 XP', '🚀');
  }

  saveState(STATE);
  setCheckState(key, !already);
  updateStreak();
}

function applyXP(key, dir) {
  const { lesson, source } = getTodayLesson();

  if (key === 'lesson') {
    // +10 to lesson skill, +10 精准提问, +10 批判性思维, +10 深度思考
    addSkillXP(lesson.skill, 10 * dir);
    addSkillXP('精准提问', 10 * dir);
    addSkillXP('批判性思维', 10 * dir);
    addSkillXP('深度思考', 10 * dir);
    // source bonus
    if (source === 'ai') addSkillXP('AI驾驭力', 10 * dir);
    if (source === 'invest') addSkillXP('投资思维', 10 * dir);
  } else if (key === 'challenge') {
    addSkillXP('建设者心态', 15 * dir);
  }
}

function addSkillXP(skill, amount) {
  if (STATE.skills[skill] === undefined) STATE.skills[skill] = 0;
  STATE.skills[skill] = Math.max(0, STATE.skills[skill] + amount);
}

// ─── SKILLS RENDER ────────────────────────────────────────────────────────────

function getTotalXP() {
  return Object.values(STATE.skills).reduce((a, b) => a + b, 0);
}

function getLevelInfo(totalXP) {
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    if (totalXP >= LEVELS[i].min) return { ...LEVELS[i], idx: i };
  }
  return { ...LEVELS[0], idx: 0 };
}

function renderSkills() {
  const totalXP = getTotalXP();
  const lvl = getLevelInfo(totalXP);

  document.getElementById('total-xp-badge').textContent = `总 XP: ${totalXP}`;
  document.getElementById('level-name').textContent = lvl.name;

  let pct = 0, currentStr = totalXP + ' XP', nextStr = '';
  if (lvl.next) {
    const range = lvl.next - lvl.min;
    const prog = totalXP - lvl.min;
    pct = Math.min(100, (prog / range) * 100);
    nextStr = `下一级: ${lvl.next} XP`;
    currentStr = totalXP + ' XP';
  } else {
    pct = 100;
    nextStr = '已达最高级！';
  }

  document.getElementById('level-bar').style.width = pct + '%';
  document.getElementById('level-xp-current').textContent = currentStr;
  document.getElementById('level-xp-next').textContent = nextStr;

  const levelSubs = ['好好学习，天天向上！', '问题越多，成长越快！', '驾驭 AI，改变未来！', '你是真正的价值创造者！'];
  document.getElementById('level-sub').textContent = levelSubs[lvl.idx] || '继续前进！';

  // Skills list
  const list = document.getElementById('skills-list');
  list.innerHTML = '';
  SKILLS_CONFIG.forEach(sc => {
    const xp = STATE.skills[sc.key] || 0;
    const level = Math.floor(xp / 100);
    const pctInLevel = (xp % 100);

    const div = document.createElement('div');
    div.className = 'skill-item';
    div.innerHTML = `
      <div class="skill-row">
        <span class="skill-name">${sc.emoji} ${sc.key}</span>
        <span class="skill-xp">${xp} XP · Lv.${level}</span>
      </div>
      <div class="skill-bar-bg">
        <div class="skill-bar-fill" style="width:${pctInLevel}%; background:${sc.gradient}" data-xp="${xp}"></div>
      </div>
    `;
    list.appendChild(div);
  });

  // Animate bars
  setTimeout(() => {
    document.querySelectorAll('.skill-bar-fill').forEach(bar => {
      const xp = parseInt(bar.dataset.xp) || 0;
      const pct = xp % 100;
      bar.style.width = pct + '%';
    });
  }, 50);
}

// ─── TOOLBOX ─────────────────────────────────────────────────────────────────

function renderToolbox() {
  const list = document.getElementById('templates-list');
  PROMPT_TEMPLATES.forEach((tpl, i) => {
    const div = document.createElement('div');
    div.className = 'template-item';
    div.innerHTML = `
      <span class="template-text">${tpl}</span>
      <button class="copy-btn" id="copy-btn-${i}" onclick="copyTemplate(${i})">复制</button>
    `;
    list.appendChild(div);
  });
}

function copyTemplate(i) {
  const text = PROMPT_TEMPLATES[i];
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => flashCopy(i));
  } else {
    // Fallback
    const el = document.createElement('textarea');
    el.value = text;
    el.style.position = 'fixed';
    el.style.opacity = '0';
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    flashCopy(i);
  }
}

function flashCopy(i) {
  const btn = document.getElementById('copy-btn-' + i);
  btn.textContent = '已复制!';
  btn.classList.add('copied');
  showToast('已复制到剪贴板', '📋');
  setTimeout(() => {
    btn.textContent = '复制';
    btn.classList.remove('copied');
  }, 2000);
}

// ─── CALCULATOR ──────────────────────────────────────────────────────────────

function calculate() {
  const pv = parseFloat(document.getElementById('calc-pv').value) || 0;
  const pmt = parseFloat(document.getElementById('calc-pmt').value) || 0;
  const rateAnnual = parseFloat(document.getElementById('calc-rate').value) || 0;
  const years = parseFloat(document.getElementById('calc-years').value) || 0;

  const r = rateAnnual / 100;
  const n = years;

  let fv;
  if (r === 0) {
    fv = pv + pmt * 12 * n;
  } else {
    // FV = PV*(1+r)^n + PMT * 12 * ((1+r)^n - 1) / r
    const growth = Math.pow(1 + r, n);
    fv = pv * growth + pmt * 12 * (growth - 1) / r;
  }

  const totalInvested = pv + pmt * 12 * n;

  document.getElementById('result-initial').textContent = formatMoney(totalInvested);
  document.getElementById('result-final').textContent = formatMoney(fv);

  // Bars
  const ratio = fv / totalInvested;
  const initialPct = 100 / ratio;
  document.getElementById('bar-initial').style.width = Math.min(100, initialPct) + '%';

  const finalPct = 100;
  // Animate
  document.getElementById('bar-final').style.width = '0%';
  setTimeout(() => {
    document.getElementById('bar-final').style.width = '100%';
    document.getElementById('bar-initial').style.width = Math.min(100, initialPct) + '%';
  }, 50);

  const mult = (fv / totalInvested).toFixed(1);
  document.getElementById('calc-multiplier').innerHTML = `总投入 ${formatMoney(totalInvested)} → 增长 <strong>${mult}倍</strong> 变成 ${formatMoney(fv)}`;

  document.getElementById('calc-result').classList.add('show');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

function init() {
  // Date
  const now = new Date();
  document.getElementById('today-date').textContent = formatDate(now);
  document.getElementById('header-date').textContent = formatDate(now);

  // Streak
  document.getElementById('streak-count').textContent = STATE.streak || 0;

  // Lesson
  renderLesson();

  // Meal
  renderMeal();

  // Toolbox
  renderToolbox();

  // Default calc result hidden
  document.getElementById('calc-result').classList.remove('show');
}

init();
</script>
