name: CI

on:
  push:
  pull_request:

# Key the group on the branch name (head_ref for PR events, ref_name for push
# events) so a push to a branch with an open PR doesn't run the whole pipeline
# twice — the duplicate run is cancelled instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · types · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - run: npm run lint
      - run: npm test -- --ci --coverage
      # `next build` type-checks the project (tsconfig strict), so a separate
      # `tsc --noEmit` step here would run the same full check twice.
      - run: npm run build
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore

  voice-memo-backend:
    name: VoiceMemoBot backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-memo-watch/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: voice-memo-watch/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Coverage flags live here (not pytest.ini) so local runs stay fast.
      - run: python -m pytest -q --cov=app --cov-report=xml --cov-fail-under=80
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
