<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thomas 每日挑战</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 60px;
    }

    /* ── 头部 ── */
    .hero {
      width: 100%;
      max-width: 400px;
      text-align: center;
      margin-bottom: 20px;
    }
    .hero-emoji { font-size: 2.8rem; display: block; margin-bottom: 6px; }
    .hero h1 {
      font-size: 1.55rem;
      font-weight: 900;
      color: #1a202c;
      letter-spacing: -0.5px;
    }
    .hero p {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* ── 打卡卡片 ── */
    .checkin-card {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 3px 16px rgba(0,0,0,0.07);
      margin-bottom: 12px;
    }
    .checkin-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stat-block { }
    .stat-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 3px;
    }
    .stat-value {
      font-size: 1.45rem;
      font-weight: 900;
      color: #1a202c;
    }
    .stat-value.blue  { color: #3b82f6; }
    .stat-value.green { color: #22c55e; }

    .streak-badge {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: white;
      border-radius: 14px;
      padding: 10px 16px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(245,158,11,0.35);
    }
    .streak-num {
      font-size: 1.8rem;
      font-weight: 900;
      display: block;
      line-height: 1;
    }
    .streak-lbl {
      font-size: 0.65rem;
      font-weight: 700;
      opacity: 0.85;
    }

    /* ── 打卡按钮 ── */
    .big-btn {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 800;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      margin-bottom: 8px;
    }
    .big-btn:active { transform: scale(0.96); }
    .big-btn.primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      box-shadow: 0 4px 14px rgba(59,130,246,0.4);
    }
    .big-btn.primary:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      box-shadow: none;
      cursor: default;
    }
    .big-btn.ghost {
      background: white;
      color: #ef4444;
      border: 2px solid #fca5a5;
      font-size: 0.88rem;
      padding: 11px;
    }
    .big-btn.ghost:disabled {
      color: #cbd5e0;
      border-color: #e2e8f0;
      cursor: default;
    }

    /* ── 分割线 ── */
    .section-head {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 26px 0 10px;
    }
    .section-line { flex: 1; height: 2px; background: #e2e8f0; border-radius: 2px; }
    .section-label {
      font-size: 0.78rem;
      font-weight: 900;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    /* ── 学习卡片 ── */
    .learn-card {
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 22px 20px;
      margin-bottom: 14px;
      box-shadow: 0 3px 16px rgba(0,0,0,0.07);
      position: relative;
    }
    .learn-card.money {
      background: linear-gradient(145deg, #fffdf5, #fef9ec);
      border: 2px solid #fde68a;
    }
    .learn-card.tech {
      background: linear-gradient(145deg, #f5f8ff, #eef2ff);
      border: 2px solid #c7d2fe;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-label {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .card-emoji { font-size: 1.3rem; }
    .card-tag {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .money .card-tag { background: #fbbf24; color: #78350f; }
    .tech  .card-tag { background: #818cf8; color: white; }

    .card-updated {
      font-size: 0.62rem;
      color: #94a3b8;
    }

    /* 今日问题 */
    .question-box {
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 0.95rem;
      font-weight: 800;
      line-height: 1.5;
      color: #1a202c;
    }
    .money .question-box { background: rgba(251,191,36,0.12); }
    .tech  .question-box { background: rgba(129,140,248,0.12); }
    .question-box::before { content: "🤔 "; }

    /* 答案 */
    .answer-box {
      font-size: 0.87rem;
      color: #374151;
      line-height: 1.7;
      margin-bottom: 10px;
    }
    .answer-box strong { color: #1a202c; }

    /* 类比 */
    .analogy-box {
      font-size: 0.82rem;
      color: #6b7280;
      font-style: italic;
      border-left: 3px solid;
      padding: 6px 10px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 10px;
      line-height: 1.55;
    }
    .money .analogy-box { border-left-color: #fbbf24; background: rgba(251,191,36,0.07); }
    .tech  .analogy-box { border-left-color: #818cf8; background: rgba(129,140,248,0.07); }
    .analogy-box::before { content: "💬 "; font-style: normal; }

    /* 挑战 */
    .challenge-box {
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #1a202c;
      line-height: 1.55;
      margin-bottom: 12px;
    }
    .money .challenge-box { background: #fef3c7; }
    .tech  .challenge-box { background: #e0e7ff; }
    .challenge-box::before { content: "🎯 今天的挑战："; display: block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; margin-bottom: 4px; }

    /* 趣味事实 */
    .funfact {
      font-size: 0.78rem;
      color: #6b7280;
      background: rgba(0,0,0,0.03);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .funfact::before { content: "⚡ 你知道吗："; font-weight: 700; color: #374151; }

    /* 底部行 */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .done-btn {
      display: inline-block;
      padding: 8px 18px;
      font-size: 0.82rem;
      font-weight: 800;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s;
      width: auto;
      max-width: none;
    }
    .done-btn:active { transform: scale(0.94); }
    .money .done-btn { background: #fbbf24; color: #78350f; }
    .tech  .done-btn { background: #818cf8; color: white; }
    .done-btn.checked {
      background: #e2e8f0 !important;
      color: #94a3b8 !important;
      cursor: default;
    }
    .source-tag {
      font-size: 0.62rem;
      color: #94a3b8;
    }

    /* loading skeleton */
    .skel {
      height: 13px;
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease infinite;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── 历史记录 ── */
    .history {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 18px;
      padding: 18px 18px 12px;
      box-shadow: 0 3px 16px rgba(0,0,0,0.07);
    }
    .history ul {
      list-style: none;
      max-height: 170px;
      overflow-y: auto;
    }
    .history li {
      font-size: 0.85rem;
      color: #4b5563;
      padding: 5px 0;
      border-bottom: 1px solid #f9fafb;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .history li:last-child { border-bottom: none; }
    .dot { color: #22c55e; font-size: 0.9rem; }
    .empty { font-size: 0.82rem; color: #cbd5e0; text-align: center; padding: 12px 0; }

    .reset-link {
      margin-top: 16px;
      font-size: 0.68rem;
      color: #cbd5e0;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- 头部 -->
  <div class="hero">
    <span class="hero-emoji">🚀</span>
    <h1>Thomas 每日挑战</h1>
    <p>英文餐桌打卡 · 每天学一件厉害的事</p>
  </div>

  <!-- 打卡卡片 -->
  <div class="checkin-card">
    <div class="checkin-row">
      <div>
        <div class="stat-label">今天</div>
        <div class="stat-value" id="todayDate">—</div>
        <div style="margin-top:10px">
          <div class="stat-label">截止目标日</div>
          <div class="stat-value blue" id="deadlineDate">—</div>
        </div>
      </div>
      <div class="streak-badge">
        <span class="streak-num" id="totalCount">0</span>
        <span class="streak-lbl">天累计打卡</span>
      </div>
    </div>
    <div style="margin-top:6px;font-size:0.75rem;color:#94a3b8;">
      每次英文吃饭打卡，目标截止日 <strong style="color:#4b5563">+1天</strong>
    </div>
  </div>

  <button class="big-btn primary" id="logBtn" onclick="logToday()">
    ✅ &nbsp;今天吃饭我说英文了！
  </button>
  <button class="big-btn ghost" id="undoBtn" onclick="undoToday()" disabled>
    ↩ 取消今天的打卡
  </button>

  <!-- 每日学习 -->
  <div class="section-head">
    <div class="section-line"></div>
    <span class="section-label">📚 今日学一件厉害的事</span>
    <div class="section-line"></div>
  </div>

  <!-- 投资卡 -->
  <div class="learn-card money" id="moneyCard">
    <div class="card-top">
      <div class="card-label">
        <span class="card-emoji">💰</span>
        <span class="card-tag">钱与投资</span>
      </div>
      <span class="card-updated" id="moneyUpdated"></span>
    </div>
    <div class="question-box" id="moneyQuestion"></div>
    <div class="answer-box"   id="moneyAnswer"></div>
    <div class="analogy-box"  id="moneyAnalogy"></div>
    <div class="challenge-box" id="moneyChallenge"></div>
    <div class="funfact"      id="moneyFunFact"></div>
    <div class="card-footer">
      <span class="source-tag" id="moneySource"></span>
      <button class="done-btn" id="moneyReadBtn" onclick="markRead('money')">我学完了 ✓</button>
    </div>
  </div>

  <!-- AI 卡 -->
  <div class="learn-card tech" id="techCard">
    <div class="card-top">
      <div class="card-label">
        <span class="card-emoji">🤖</span>
        <span class="card-tag">AI 与科技</span>
      </div>
      <span class="card-updated" id="techUpdated"></span>
    </div>
    <div class="question-box" id="techQuestion"></div>
    <div class="answer-box"   id="techAnswer"></div>
    <div class="analogy-box"  id="techAnalogy"></div>
    <div class="challenge-box" id="techChallenge"></div>
    <div class="funfact"      id="techFunFact"></div>
    <div class="card-footer">
      <span class="source-tag" id="techSource"></span>
      <button class="done-btn" id="techReadBtn" onclick="markRead('tech')">我学完了 ✓</button>
    </div>
  </div>

  <!-- 历史 -->
  <div class="section-head" style="margin-top:14px;">
    <div class="section-line"></div>
    <span class="section-label">📅 打卡记录</span>
    <div class="section-line"></div>
  </div>

  <div class="history">
    <ul id="historyList">
      <li class="empty">还没有打卡记录～加油！</li>
    </ul>
  </div>

  <span class="reset-link" onclick="confirmReset()">重置所有数据</span>

  <script>
    const STORE = 'thomas_checkin';
    const RKEY  = 'thomas_read';

    // ── 备用内容（fetch 失败时用）──────────────────────────
    const FALLBACK = {
      invest: [{
        question: "如果你有 $100 放在枕头下面 30 年，还是 $100。但"种"进股市会变多少？",
        answer: "$100 以年化 10% 种进去，30 年后长成 <strong>$1,745</strong>！钱会自己生钱，这叫 <strong>复利</strong>，巴菲特说这是世界上最厉害的魔法。",
        analogy: "就像雪球从山顶滚下来——开始很小，越滚越大，到山脚变成超级大雪球。",
        challenge: "问爸爸妈妈：我们家有没有在存钱或投资？他们是怎么做的？",
        funFact: "巴菲特 95% 的财富是他 50 岁之后才赚到的——靠的就是复利滚了几十年。",
        source: "Berkshire Hathaway Annual Letter"
      }],
      ai: [{
        question: "ChatGPT 怎么知道那么多事？它真的"懂"吗？",
        answer: "ChatGPT 读了整个互联网几乎所有的文字，然后学会了"下一个词该是什么"。看起来很懂，其实是在做超级聪明的填空题！这叫 <strong>大语言模型（LLM）</strong>。",
        analogy: "就像你看了一万部电影，让你猜下一幕会发生什么——你猜得很准，但不是真的经历过那些故事。",
        challenge: "打开 ChatGPT，问它：'你真的理解我说的话吗？' 看它怎么回答！",
        funFact: "训练 ChatGPT 用的文字量，打印出来摞起来的高度比月球到地球还要长！",
        source: "CodaKid / SafeAIKids.com"
      }]
    };

    let LESSONS = null;

    // ── 工具函数 ─────────────────────────────────────────────
    function fmt(d)        { return d.toISOString().slice(0,10); }
    function todayStr()    { return fmt(new Date()); }
    function displayDate(s) {
      const [y,m,d] = s.split('-');
      return `${y}年${parseInt(m)}月${parseInt(d)}日`;
    }
    function dayIdx(len) {
      const d = new Date();
      return (d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate()) % len;
    }

    // ── 打卡数据 ─────────────────────────────────────────────
    function loadStore() {
      const r = localStorage.getItem(STORE);
      if (r) return JSON.parse(r);
      const dl = new Date(); dl.setDate(dl.getDate() + 30);
      return { deadline: fmt(dl), logs: [] };
    }
    function saveStore(d) { localStorage.setItem(STORE, JSON.stringify(d)); }
    function getRead() {
      const r = localStorage.getItem(RKEY);
      return r ? JSON.parse(r) : { date:'', money:false, tech:false };
    }

    // ── 打卡渲染 ─────────────────────────────────────────────
    function render() {
      const data   = loadStore();
      const today  = todayStr();
      const logged = data.logs.includes(today);

      document.getElementById('todayDate').textContent    = displayDate(today);
      document.getElementById('deadlineDate').textContent = displayDate(data.deadline);
      document.getElementById('totalCount').textContent   = data.logs.length;

      document.getElementById('logBtn').disabled  = logged;
      document.getElementById('undoBtn').disabled = !logged;

      const list = document.getElementById('historyList');
      if (!data.logs.length) {
        list.innerHTML = '<li class="empty">还没有打卡记录～加油！</li>';
      } else {
        list.innerHTML = [...data.logs].sort((a,b)=>b.localeCompare(a))
          .map(d=>`<li><span class="dot">★</span>${displayDate(d)}</li>`).join('');
      }
    }

    function logToday() {
      const data = loadStore(), today = todayStr();
      if (data.logs.includes(today)) return;
      data.logs.push(today);
      const dl = new Date(data.deadline+'T00:00:00'); dl.setDate(dl.getDate()+1);
      data.deadline = fmt(dl);
      saveStore(data); render();
    }
    function undoToday() {
      const data = loadStore(), today = todayStr();
      data.logs = data.logs.filter(d=>d!==today);
      const dl = new Date(data.deadline+'T00:00:00'); dl.setDate(dl.getDate()-1);
      data.deadline = fmt(dl);
      saveStore(data); render();
    }
    function confirmReset() {
      if (confirm('确定要清除所有记录吗？')) {
        localStorage.removeItem(STORE);
        render();
      }
    }

    // ── 学习卡渲染 ────────────────────────────────────────────
    function showSkeleton(prefix) {
      ['Question','Answer','Analogy','Challenge','FunFact'].forEach(f => {
        const el = document.getElementById(prefix+f);
        if (el) el.innerHTML = `<div class="skel" style="width:${55+Math.random()*35}%"></div>`;
      });
    }

    function fillCard(prefix, lesson, meta) {
      document.getElementById(prefix+'Question').textContent  = lesson.question  || '';
      document.getElementById(prefix+'Answer').innerHTML      = lesson.answer    || '';
      document.getElementById(prefix+'Analogy').textContent   = lesson.analogy   || '';
      document.getElementById(prefix+'Challenge').textContent = lesson.challenge || '';
      document.getElementById(prefix+'FunFact').textContent   = lesson.funFact   || '';
      document.getElementById(prefix+'Source').textContent    = lesson.source    || '';
      const upd = document.getElementById(prefix+'Updated');
      if (upd && meta && meta.lastUpdated) upd.textContent = '更新于 ' + meta.lastUpdated;
    }

    function applyRead() {
      const today = todayStr(), rd = getRead();
      const same  = rd.date === today;
      ['money','tech'].forEach(t => {
        const btn = document.getElementById(t+'ReadBtn');
        if (same && rd[t]) {
          btn.textContent = '已学完 ✅';
          btn.classList.add('checked');
        } else {
          btn.textContent = '我学完了 ✓';
          btn.classList.remove('checked');
        }
      });
    }

    function markRead(type) {
      const today = todayStr(), rd = getRead();
      if (rd.date !== today) { rd.date=today; rd.money=false; rd.tech=false; }
      rd[type] = true;
      localStorage.setItem(RKEY, JSON.stringify(rd));
      applyRead();
    }

    function renderLearn(data) {
      const inv = data.invest[dayIdx(data.invest.length)];
      const ai  = data.ai[dayIdx(data.ai.length)];
      fillCard('money', inv, data._meta);
      fillCard('tech',  ai,  data._meta);
      applyRead();
    }

    // ── 启动 ─────────────────────────────────────────────────
    function init() {
      render();
      showSkeleton('money');
      showSkeleton('tech');

      fetch('./thomas-lessons.json?v=' + todayStr())
        .then(r => { if(!r.ok) throw 0; return r.json(); })
        .then(d  => renderLearn(d))
        .catch(()=> renderLearn(FALLBACK));
    }

    init();
  </script>
</body>
</html>
