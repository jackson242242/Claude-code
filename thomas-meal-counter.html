<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thomas 每日成长</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    h1 {
      font-size: 1.35rem;
      color: #1a202c;
      margin-bottom: 6px;
      text-align: center;
      font-weight: 800;
    }

    .subtitle {
      font-size: 0.78rem;
      color: #a0aec0;
      text-align: center;
      margin-bottom: 24px;
    }

    /* ── 基础卡片 ── */
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      margin-bottom: 12px;
    }

    .label {
      font-size: 0.72rem;
      color: #a0aec0;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }

    .value {
      font-size: 1.5rem;
      font-weight: 800;
      color: #2d3748;
    }
    .value.blue  { color: #3182ce; }
    .value.green { color: #38a169; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f0f4f8;
    }

    .badge {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
    }
    .badge.done    { background: #c6f6d5; color: #276749; }
    .badge.pending { background: #fed7d7; color: #9b2c2c; }

    /* ── 按钮 ── */
    .btn {
      width: 100%;
      max-width: 400px;
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary  { background: #3182ce; color: white; margin-bottom: 8px; }
    .btn-primary:disabled { background: #a0aec0; cursor: default; }
    .btn-outline  { background: white; color: #e53e3e; border: 2px solid #e53e3e; font-size: 0.88rem; padding: 11px; }
    .btn-outline:disabled { color: #cbd5e0; border-color: #cbd5e0; cursor: default; }

    /* ── 分割线 ── */
    .divider {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 28px 0 8px;
    }
    .divider-line { flex: 1; height: 1px; background: #e2e8f0; }
    .divider-text {
      font-size: 0.72rem;
      font-weight: 800;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    /* ── 学习卡片 ── */
    .learn-card {
      width: 100%;
      max-width: 400px;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.08);
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .learn-card.invest { background: linear-gradient(145deg, #fffdf0, #fef3c7); }
    .learn-card.ai     { background: linear-gradient(145deg, #f0f7ff, #dbeafe); }

    .learn-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .learn-tag-group { display: flex; align-items: center; gap: 6px; }
    .learn-icon { font-size: 1.1rem; }
    .learn-tag {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .invest .learn-tag { background: #d97706; color: white; }
    .ai     .learn-tag { background: #2563eb; color: white; }

    .updated-tag {
      font-size: 0.62rem;
      color: #94a3b8;
      font-weight: 500;
    }

    /* 新闻钩子 */
    .learn-hook {
      font-size: 0.78rem;
      font-weight: 700;
      color: #475569;
      background: rgba(0,0,0,0.04);
      border-left: 3px solid currentColor;
      padding: 7px 10px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .invest .learn-hook { border-left-color: #d97706; color: #92400e; background: rgba(217,119,6,0.07); }
    .ai     .learn-hook { border-left-color: #2563eb; color: #1e3a8a; background: rgba(37,99,235,0.07); }

    .learn-title {
      font-size: 0.97rem;
      font-weight: 800;
      color: #1a202c;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .learn-body {
      font-size: 0.84rem;
      color: #4a5568;
      line-height: 1.65;
      margin-bottom: 10px;
    }
    .learn-body strong { color: #1a202c; }

    /* 行动洞察 */
    .learn-insight {
      font-size: 0.78rem;
      color: #374151;
      background: rgba(0,0,0,0.04);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      line-height: 1.55;
    }
    .learn-insight::before {
      content: "💡 ";
      font-style: normal;
    }

    .learn-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .learn-source {
      font-size: 0.65rem;
      color: #94a3b8;
    }
    .learn-source::before { content: "📰 "; }

    .read-btn {
      display: inline-block;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s;
      width: auto;
      max-width: none;
    }
    .read-btn:active { transform: scale(0.95); }
    .invest .read-btn { background: #d97706; color: white; }
    .ai     .read-btn { background: #2563eb; color: white; }
    .read-btn.done { background: #e2e8f0 !important; color: #94a3b8 !important; cursor: default; }

    /* 加载状态 */
    .loading-pulse {
      height: 14px;
      background: linear-gradient(90deg, #e2e8f0 25%, #f8fafc 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: pulse 1.4s ease infinite;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    @keyframes pulse {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── 历史记录 ── */
    .history-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    .history-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: #4a5568;
      margin-bottom: 10px;
    }
    .history-list {
      list-style: none;
      max-height: 180px;
      overflow-y: auto;
    }
    .history-list li {
      font-size: 0.84rem;
      color: #4a5568;
      padding: 5px 0;
      border-bottom: 1px solid #f7fafc;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .history-list li:last-child { border-bottom: none; }
    .dot { color: #38a169; }
    .empty-msg { font-size: 0.82rem; color: #a0aec0; text-align: center; padding: 10px 0; }

    .reset-link {
      margin-top: 18px;
      font-size: 0.7rem;
      color: #cbd5e0;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>Thomas 每日成长</h1>
  <p class="subtitle">英文饮食打卡 · 长期投资 · AI 前沿</p>

  <!-- 打卡状态 -->
  <div class="card">
    <div class="label">今天日期</div>
    <div class="value" id="todayDate">—</div>
    <div class="row">
      <div>
        <div class="label">今日打卡</div>
        <span class="badge pending" id="todayBadge">未打卡</span>
      </div>
      <div style="text-align:right">
        <div class="label">累计天数</div>
        <div class="value green" id="totalCount">0 天</div>
      </div>
    </div>
  </div>

  <!-- 目标截止日 -->
  <div class="card">
    <div class="label">目标截止日</div>
    <div class="value blue" id="deadlineDate">—</div>
    <div style="margin-top:7px;font-size:0.8rem;color:#94a3b8;">
      每打卡一次，截止日 <strong style="color:#4a5568">+1 天</strong>
    </div>
  </div>

  <button class="btn btn-primary" id="logBtn" onclick="logToday()">✅ 今天吃饭说英文了！</button>
  <button class="btn btn-outline" id="undoBtn" onclick="undoToday()" disabled>↩ 撤销今天的打卡</button>

  <!-- 每日学习 -->
  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">📚 今日学习</span>
    <div class="divider-line"></div>
  </div>

  <!-- 投资卡片 -->
  <div class="learn-card invest" id="investCard">
    <div class="learn-card-header">
      <div class="learn-tag-group">
        <span class="learn-icon">📈</span>
        <span class="learn-tag">长期投资</span>
      </div>
      <span class="updated-tag" id="investUpdated"></span>
    </div>
    <div id="investHook" class="learn-hook"></div>
    <div id="investTitle" class="learn-title"></div>
    <div id="investBody" class="learn-body"></div>
    <div id="investInsight" class="learn-insight"></div>
    <div class="learn-footer">
      <span id="investSource" class="learn-source"></span>
      <button class="read-btn" id="investReadBtn" onclick="markRead('invest')">✓ 我学了</button>
    </div>
  </div>

  <!-- AI卡片 -->
  <div class="learn-card ai" id="aiCard">
    <div class="learn-card-header">
      <div class="learn-tag-group">
        <span class="learn-icon">🤖</span>
        <span class="learn-tag">AI 前沿</span>
      </div>
      <span class="updated-tag" id="aiUpdated"></span>
    </div>
    <div id="aiHook" class="learn-hook"></div>
    <div id="aiTitle" class="learn-title"></div>
    <div id="aiBody" class="learn-body"></div>
    <div id="aiInsight" class="learn-insight"></div>
    <div class="learn-footer">
      <span id="aiSource" class="learn-source"></span>
      <button class="read-btn" id="aiReadBtn" onclick="markRead('ai')">✓ 我学了</button>
    </div>
  </div>

  <!-- 历史记录 -->
  <div class="divider" style="margin-top:20px;">
    <div class="divider-line"></div>
    <span class="divider-text">📅 打卡记录</span>
    <div class="divider-line"></div>
  </div>

  <div class="history-card">
    <ul class="history-list" id="historyList">
      <li class="empty-msg">还没有打卡记录</li>
    </ul>
  </div>

  <span class="reset-link" onclick="confirmReset()">重置所有数据</span>

  <script>
    const STORAGE_KEY = 'thomas_meal_counter';
    const READ_KEY    = 'thomas_learn_read';

    // ── 备用内容（fetch 失败时使用）──────────────────────────
    const FALLBACK = {
      invest: [{
        title: "复利：世界第八大奇迹",
        hook: "巴菲特说他95%的财富是在50岁之后积累的——靠的不是选股技巧，而是几十年不间断的复利。",
        body: "$10,000 以年化10%增长，<strong>30年后变 $174,494，40年后变 $452,593</strong>。每多一年，差距越来越大。",
        insight: "今天的行动：设置一个哪怕$50/月的自动定投计划，开始比金额更重要。",
        source: "Berkshire Hathaway Annual Letter"
      }],
      ai: [{
        title: "什么是大语言模型（LLM）？",
        hook: "2022年ChatGPT发布后，AI从实验室走向了10亿人的日常——背后是语言模型的革命。",
        body: "LLM 在海量文本上训练，学会预测"下一个词"。<strong>它不是数据库查询，而是统计模式的涌现</strong>。",
        insight: "试着用不同方式问AI同一个问题，观察答案差异——感受提示词的力量。",
        source: "OpenAI / Anthropic Research Blog"
      }]
    };

    let LESSONS = null;

    // ── 工具函数 ─────────────────────────────────────────────
    function fmt(date) { return date.toISOString().slice(0, 10); }
    function fmtDisplay(s) {
      const [y, m, d] = s.split('-');
      return `${y} 年 ${parseInt(m)} 月 ${parseInt(d)} 日`;
    }
    function todayStr() { return fmt(new Date()); }
    function dayIndex(len) {
      const d = new Date();
      const n = d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate();
      return n % len;
    }

    // ── localStorage ─────────────────────────────────────────
    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
      const def = new Date(); def.setDate(def.getDate() + 30);
      return { deadline: fmt(def), logs: [] };
    }
    function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
    function getTodayRead() {
      const raw = localStorage.getItem(READ_KEY);
      return raw ? JSON.parse(raw) : { date: '', invest: false, ai: false };
    }

    // ── 打卡渲染 ─────────────────────────────────────────────
    function render() {
      const data = loadData();
      const today = todayStr();
      const logged = data.logs.includes(today);

      document.getElementById('todayDate').textContent = fmtDisplay(today);
      document.getElementById('deadlineDate').textContent = fmtDisplay(data.deadline);
      document.getElementById('totalCount').textContent = data.logs.length + ' 天';

      const badge = document.getElementById('todayBadge');
      badge.textContent = logged ? '已打卡 ✅' : '未打卡';
      badge.className   = 'badge ' + (logged ? 'done' : 'pending');

      document.getElementById('logBtn').disabled  = logged;
      document.getElementById('undoBtn').disabled = !logged;

      const list = document.getElementById('historyList');
      if (data.logs.length === 0) {
        list.innerHTML = '<li class="empty-msg">还没有打卡记录</li>';
      } else {
        list.innerHTML = [...data.logs].sort((a,b) => b.localeCompare(a))
          .map(d => `<li><span class="dot">●</span>${fmtDisplay(d)}</li>`)
          .join('');
      }
    }

    function logToday() {
      const data = loadData(), today = todayStr();
      if (data.logs.includes(today)) return;
      data.logs.push(today);
      const dl = new Date(data.deadline + 'T00:00:00'); dl.setDate(dl.getDate() + 1);
      data.deadline = fmt(dl);
      saveData(data); render();
    }

    function undoToday() {
      const data = loadData(), today = todayStr();
      if (!data.logs.includes(today)) return;
      data.logs = data.logs.filter(d => d !== today);
      const dl = new Date(data.deadline + 'T00:00:00'); dl.setDate(dl.getDate() - 1);
      data.deadline = fmt(dl);
      saveData(data); render();
    }

    function confirmReset() {
      if (confirm('确定要清除所有打卡记录并重置截止日吗？')) {
        localStorage.removeItem(STORAGE_KEY);
        render();
      }
    }

    // ── 学习内容渲染 ─────────────────────────────────────────
    function showLoading(type) {
      ['Hook','Title','Body','Insight'].forEach(f => {
        const el = document.getElementById(type + f);
        if (el) el.innerHTML = '<div class="loading-pulse" style="width:' + (60+Math.random()*30) + '%"></div>';
      });
    }

    function fillCard(type, lesson, meta) {
      document.getElementById(type + 'Hook').textContent    = lesson.hook || '';
      document.getElementById(type + 'Title').textContent   = lesson.title;
      document.getElementById(type + 'Body').innerHTML      = lesson.body;
      document.getElementById(type + 'Insight').textContent = lesson.insight || '';
      document.getElementById(type + 'Source').textContent  = lesson.source || '';
      if (meta && meta.lastUpdated) {
        document.getElementById(type + 'Updated').textContent = '更新于 ' + meta.lastUpdated;
      }
    }

    function applyReadState() {
      const today = todayStr();
      const read  = getTodayRead();
      const isToday = read.date === today;

      ['invest','ai'].forEach(type => {
        const btn = document.getElementById(type + 'ReadBtn');
        if (isToday && read[type]) {
          btn.textContent = '已学习 ✅';
          btn.classList.add('done');
        } else {
          btn.textContent = '✓ 我学了';
          btn.classList.remove('done');
        }
      });
    }

    function renderLearn(data) {
      const inv = data.invest[dayIndex(data.invest.length)];
      const ai  = data.ai[dayIndex(data.ai.length)];
      fillCard('invest', inv, data._meta);
      fillCard('ai',     ai,  data._meta);
      applyReadState();
    }

    function markRead(type) {
      const today = todayStr();
      const read  = getTodayRead();
      if (read.date !== today) { read.date = today; read.invest = false; read.ai = false; }
      read[type] = true;
      localStorage.setItem(READ_KEY, JSON.stringify(read));
      applyReadState();
    }

    // ── 启动：fetch JSON，失败则用备用 ───────────────────────
    function init() {
      render();
      showLoading('invest');
      showLoading('ai');

      fetch('./thomas-lessons.json?v=' + todayStr())
        .then(r => { if (!r.ok) throw new Error('fetch failed'); return r.json(); })
        .then(data => { LESSONS = data; renderLearn(data); })
        .catch(() => { renderLearn(FALLBACK); });
    }

    init();
  </script>
</body>
</html>
